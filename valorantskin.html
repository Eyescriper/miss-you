<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>狂徒皮肤二选一淘汰赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #0f1419;
            color: #fff;
            font-family: "Microsoft Yahei",sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding:20px;
        }
        .title{
            font-size:28px;
            margin-bottom:12px;
            color:#ffc145;
        }
        .progress{
            font-size:18px;
            margin-bottom:40px;
            color:#cccccc;
        }
        .container{
            display:flex;
            gap:32px;
        }
        .skin-btn{
            width:300px;
            height:180px;
            font-size:22px;
            border-radius:14px;
            border: 2px solid #333;
            background:#1b222c;
            color:white;
            cursor:pointer;
            transition: all 0.25s;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:12px;
        }
        .skin-btn:hover{
            border-color:#ffc145;
            background:#262f3b;
            transform: scale(1.04);
        }
        .tier-tag{
            font-size:15px;
            margin-top:10px;
        }
        .gold{
            color:#ffd700;
        }
        .orange{
            color:#ff7b26;
        }
        .purple{
            color:#b06bff;
        }
        .result-box{
            text-align:center;
        }
        .final-name{
            font-size:38px;
            color:#ffc145;
            margin:24px 0;
        }
        .restart-btn{
            margin-top:20px;
            padding:12px 24px;
            font-size:18px;
            border-radius:8px;
            background:#ffc145;
            border:none;
            cursor:pointer;
            color:#0f1419;
        }
    </style>
</head>
<body>
<div class="title">无畏契约｜狂徒皮肤二选一淘汰赛</div>
<div class="progress" id="progressText"></div>
<div class="container" id="box">
    <button class="skin-btn" id="btnA"></button>
    <button class="skin-btn" id="btnB"></button>
</div>

<script>
    // 完全使用你提供的狂徒皮肤列表，没有额外新增！
    const allSkinList = [
        // 金色【终极品质】
        {name:"上古龙焱 狂徒", tier:"终极", color:"gold"},
        {name:"艾沃莉的梦之翼 狂徒", tier:"终极", color:"gold"},
        {name:"超时空卫队 狂徒", tier:"终极", color:"gold"},
        {name:"创・纪元 狂徒", tier:"终极", color:"gold"},

        // 橙色【传奇品质】
        {name:"塑水宗 狂徒", tier:"传奇", color:"orange"},
        {name:"混沌序曲 狂徒", tier:"传奇", color:"orange"},
        {name:"光明哨兵 狂徒", tier:"传奇", color:"orange"},
        {name:"RGX 11z Pro 狂徒", tier:"传奇", color:"orange"},
        {name:"洪荒怒焰 狂徒", tier:"传奇", color:"orange"},
        {name:"千灵华绽 //2.0 狂徒", tier:"传奇", color:"orange"},
        {name:"噬影者 狂徒", tier:"传奇", color:"orange"},
        {name:"宇宙幻景 狂徒", tier:"传奇", color:"orange"},
        {name:"2021 全球冠军赛 狂徒【绝版】", tier:"传奇", color:"orange"},
        {name:"2023 全球冠军赛 狂徒【绝版】", tier:"传奇", color:"orange"},
        {name:"2025 全球冠军赛 狂徒【绝版】", tier:"传奇", color:"orange"},
        {name:"荆刺圣骸 狂徒", tier:"传奇", color:"orange"},

        // 紫色【卓越品质】
        {name:"盖亚的复仇 狂徒", tier:"卓越", color:"purple"},
        {name:"紫阙金琅 狂徒（紫金）", tier:"卓越", color:"purple"},
        {name:"堕天遗武 狂徒", tier:"卓越", color:"purple"},
        {name:"耀鳞威龙 狂徒", tier:"卓越", color:"purple"},
        {name:"般若假面 //2.0 狂徒", tier:"卓越", color:"purple"},
        {name:"冰点凝冻 狂徒", tier:"卓越", color:"purple"},
        {name:"掠影 狂徒", tier:"卓越", color:"purple"},
        {name:"盖世英雄 狂徒", tier:"卓越", color:"purple"},
        {name:"海洋之星 狂徒", tier:"卓越", color:"purple"},
        {name:"日冕雄狮 狂徒", tier:"卓越", color:"purple"},
        {name:"起源 狂徒", tier:"卓越", color:"purple"},
        {name:"光荣异象 狂徒", tier:"卓越", color:"purple"},
        {name:"奇点 //2.0 狂徒", tier:"卓越", color:"purple"},
        {name:"逆命中队 狂徒", tier:"卓越", color:"purple"},
        {name:"圣契命澜 狂徒", tier:"卓越", color:"purple"},
    ];

    let candidates = [];
    let currentWinner = null;
    let roundIndex = 1;

    // 数组洗牌打乱顺序
    function shuffle(arr){
        const newArr = [...arr];
        for(let i=newArr.length-1;i>0;i--){
            const r = Math.floor(Math.random()*(i+1));
            [newArr[i], newArr[r]] = [newArr[r], newArr[i]];
        }
        return newArr;
    }

    function startGame(){
        candidates = shuffle(allSkinList);
        currentWinner = candidates.shift();
        roundIndex = 1;
        renderBattle();
    }

    function renderBattle(){
        // 全部对比完毕，展示最终冠军
        if(candidates.length === 0){
            document.getElementById("box").innerHTML = `
                    <div class="result-box">
                        <div>🎉 全部PK结束！你的本命狂徒：</div>
                        <div class="final-name">${currentWinner.name}</div>
                        <div class="tier-tag ${currentWinner.color}">品质：${currentWinner.tier}</div>
                        <button class="restart-btn" onclick="startGame()">重新开始PK</button>
                    </div>
                `;
            return;
        }
        // 取出下一个挑战者
        const challenger = candidates.shift();
        document.getElementById("progressText")
            .innerText = `第${roundIndex}轮PK｜剩余待对比: ${candidates.length}`;

        const btnA = document.getElementById("btnA");
        const btnB = document.getElementById("btnB");

        btnA.innerHTML = `${currentWinner.name}<div class="tier-tag ${currentWinner.color}">【${currentWinner.tier}】</div>`;
        btnB.innerHTML = `${challenger.name}<div class="tier-tag ${challenger.color}">【${challenger.tier}】</div>`;

        // 点击选择A，A保留为胜者
        btnA.onclick = ()=>{
            currentWinner = currentWinner;
            roundIndex++;
            renderBattle();
        }
        // 点击选择B，挑战者成为新胜者
        btnB.onclick = ()=>{
            currentWinner = challenger;
            roundIndex++;
            renderBattle();
        }
    }
    startGame();
</script>
</body>
</html>
